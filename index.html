<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillBridge Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Header -->
    <header class="bg-indigo-700 text-white p-6 shadow-md text-center">
        <h1 class="text-3xl font-bold">SkillBridge</h1>
        <p class="text-indigo-200 mt-1">Empowering Rural Artisans in Telugu, Hindi & English</p>
    </header>

    <main class="max-w-4xl mx-auto p-6 space-y-8">

        <!-- Voice Registration Section -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <h2 class="text-xl font-semibold text-indigo-700 mb-2">🎙️ Multilingual Voice Registration</h2>
            <p class="text-sm text-gray-600 mb-4">Speak or type any job (e.g., <em>cooking, tailoring, pottery, bamboo, painting, jewelry, farming</em>):</p>
            
            <div class="mb-4">
                <label class="block text-xs font-semibold text-gray-600 mb-1">Select Voice Language:</label>
                <select id="langSelect" class="border border-gray-300 rounded-lg px-3 py-2 bg-white text-sm">
                    <option value="te-IN">Telugu (తెలుగు)</option>
                    <option value="hi-IN">Hindi (हिन्दी)</option>
                    <option value="en-IN" selected>English (India)</option>
                </select>
            </div>

            <div class="flex flex-wrap gap-3 mb-3">
                <input type="text" id="voiceInput" placeholder="Speak or type your craft/job here..." 
                       class="flex-1 min-w-[220px] border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <button onclick="startListening()" class="bg-red-500 text-white px-4 py-2 rounded-lg font-medium hover:bg-red-600 transition">
                    🎤 Speak
                </button>
                <button onclick="testVoiceAPI()" class="bg-indigo-600 text-white px-5 py-2 rounded-lg font-medium hover:bg-indigo-700 transition">
                    Process Voice
                </button>
            </div>
            <p id="micStatus" class="text-xs text-gray-500 italic"></p>

            <div id="voiceResult" class="mt-4 p-5 bg-indigo-50 border border-indigo-100 rounded-xl hidden text-sm space-y-2"></div>
        </section>

        <!-- Fair Pricing Calculator Section -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <h2 class="text-xl font-semibold text-indigo-700 mb-3">💰 Fair Pricing Calculator</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Material Cost (₹)</label>
                    <input type="number" id="materialCost" value="350" class="w-full border border-gray-300 rounded-lg px-3 py-2">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Labor Hours</label>
                    <input type="number" id="laborHours" value="6" class="w-full border border-gray-300 rounded-lg px-3 py-2">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Hourly Wage (₹)</label>
                    <input type="number" id="hourlyWage" value="60" class="w-full border border-gray-300 rounded-lg px-3 py-2">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Skill Complexity (1.0 - 2.0)</label>
                    <input type="number" step="0.1" id="complexity" value="1.5" class="w-full border border-gray-300 rounded-lg px-3 py-2">
                </div>
            </div>

            <button onclick="testPricingAPI()" class="bg-emerald-600 text-white px-5 py-2 rounded-lg font-medium hover:bg-emerald-700 transition">
                Calculate Fair Price
            </button>

            <!-- Detailed Pricing Breakdown Card -->
            <div id="pricingResult" class="mt-4 p-5 bg-emerald-50 border border-emerald-100 rounded-xl hidden text-sm space-y-2"></div>
        </section>

    </main>

    <!-- JavaScript -->
    <script>
        function startListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Speech recognition is not supported in this browser. Please use Google Chrome.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = document.getElementById('langSelect').value;
            recognition.interimResults = false;

            const statusText = document.getElementById('micStatus');
            statusText.innerText = "Listening... Speak now.";

            recognition.onresult = function(event) {
                const speechText = event.results[0][0].transcript;
                document.getElementById('voiceInput').value = speechText;
                statusText.innerText = "Speech captured successfully!";
                testVoiceAPI();
            };

            recognition.onerror = function(event) {
                statusText.innerText = "Error occurred: " + event.error;
            };

            recognition.start();
        }

        async function testVoiceAPI() {
            const transcript = document.getElementById('voiceInput').value;
            const response = await fetch('/api/parse-voice', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ transcript })
            });
            const data = await response.json();
            const p = data.parsed_profile;

            document.getElementById('hourlyWage').value = p.suggested_hourly_wage;
            document.getElementById('complexity').value = p.recommended_complexity;
            
            const resultBox = document.getElementById('voiceResult');
            resultBox.classList.remove('hidden');
            resultBox.innerHTML = `
                <div class="flex justify-between items-center border-b border-indigo-200 pb-2 mb-2">
                    <span class="font-bold text-indigo-800 text-base">✅ Artisan Profile Matched</span>
                    <span class="bg-green-100 text-green-800 text-xs font-semibold px-2.5 py-0.5 rounded">Verified Skill</span>
                </div>
                <p><strong>🗣️ Spoken Input:</strong> "${p.spoken_text}"</p>
                <p><strong>🛠️ Job / Craft Category:</strong> ${p.craft_category}</p>
                <p><strong>📦 Typical Products / Services:</strong> ${p.item_name}</p>
                <p><strong>💵 Recommended Base Wage:</strong> ₹${p.suggested_hourly_wage}/hr (Complexity: ${p.recommended_complexity}x)</p>
                <p><strong>🏪 Target Buyers:</strong> ${p.target_buyers}</p>
            `;
        }

        async function testPricingAPI() {
            const material_cost = document.getElementById('materialCost').value;
            const labor_hours = document.getElementById('laborHours').value;
            const hourly_wage = document.getElementById('hourlyWage').value;
            const complexity = document.getElementById('complexity').value;

            const response = await fetch('/api/calculate-price', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ material_cost, labor_hours, hourly_wage, complexity })
            });
            const data = await response.json();

            const resultBox = document.getElementById('pricingResult');
            resultBox.classList.remove('hidden');
            resultBox.innerHTML = `
                <div class="font-bold text-emerald-800 text-base border-b border-emerald-200 pb-2 mb-2">📊 Detailed Fair Pricing Breakdown</div>
                <p><strong>🧵 Raw Material Reimbursement:</strong> ₹${data.material_cost_inr}</p>
                <p><strong>⏱️ Skill & Labor Compensation:</strong> ₹${data.labor_compensation_inr}</p>
                <p class="text-base text-emerald-900 pt-1"><strong>✨ Direct Artisan Payout: ₹${data.artisan_payout_inr}</strong> <span class="text-xs text-gray-600">(${data.artisan_margin_percentage}% labor value share)</span></p>
                <p><strong>⚙️ Platform Upkeep Fee (5%):</strong> ₹${data.platform_fee_inr}</p>
                <p class="text-base text-gray-900"><strong>🏷️ Final Buyer Retail Price: ₹${data.retail_price_inr}</strong></p>
            `;
        }
    </script>
</body>
</html>
